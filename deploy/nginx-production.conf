map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name monopoly.nebunezzariii.ru;
    ssl_certificate /etc/letsencrypt/live/nebunezzariii.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nebunezzariii.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Monopoly";
    auth_basic_user_file /etc/nginx/monopoly.htpasswd;

    location / {
        proxy_pass http://monopoly:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
