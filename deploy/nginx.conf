# Install inside the nginx http context (e.g. /etc/nginx/conf.d/monopoly.conf).
# Replace the hostname and TLS certificate paths before enabling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name monopoly.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monopoly.example.com;
    ssl_certificate /etc/letsencrypt/live/monopoly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monopoly.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Covers HTML, JavaScript, assets, health and WebSocket handshake.
    auth_basic "Friends only";
    auth_basic_user_file /etc/nginx/monopoly.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
